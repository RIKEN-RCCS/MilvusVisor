name: Build Hypervisor

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup the environment
        run: rustup default nightly
      - name: Build
        run: cd src && cargo xtask build
      - uses: actions/upload-artifact@v4
        with:
          name: MilvusVisor
          path: src/bin/
          compression-level: 9
